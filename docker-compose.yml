services:
  db:
    image: postgres:18-alpine
    container_name: donendusted-db
    environment:
      POSTGRES_DB: donendusted
      POSTGRES_USER: donendusted
      POSTGRES_PASSWORD: donendusted
    ports:
      - "5432:5432"
    volumes:
      - donendusted-data:/var/lib/postgresql/data

volumes:
  donendusted-data:
