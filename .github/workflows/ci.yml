name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -ntp verify

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run contrast
      - run: npm test
      - run: npm run build

  e2e:
    name: API contract and end-to-end tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start API (dev profile, embedded PostgreSQL)
        run: |
          ./mvnw -B -ntp -q spring-boot:run > api.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://localhost:8080/actuator/health && exit 0
            sleep 2
          done
          cat api.log
          exit 1

      - name: Postman collection (newman)
        run: npx --yes newman run postman/DoneNDusted.postman_collection.json

      - name: Install frontend and browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start frontend
        working-directory: frontend
        run: |
          npx vite --port 5173 --strictPort > vite.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173/ > /dev/null && exit 0
            sleep 1
          done
          cat vite.log
          exit 1

      - name: Playwright
        working-directory: frontend
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            api.log
          retention-days: 7
