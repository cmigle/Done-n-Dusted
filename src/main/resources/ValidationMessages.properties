# Bean Validation messages (details[].message). Hibernate Validator finds this file by name and uses it
# instead of its built-in, JVM-locale dependent defaults. The field is returned separately
# (details[].field), so the messages talk about the value. ${...} is Expression Language:
# min == 0 means that only max was given.
jakarta.validation.constraints.NotBlank.message=Must not be blank
jakarta.validation.constraints.NotNull.message=Required
jakarta.validation.constraints.Size.message=Must be ${min == 0 ? 'at most' : 'between ' += min += ' and'} {max} characters
jakarta.validation.constraints.Pattern.message=Invalid format
jakarta.validation.constraints.Min.message=Must be at least {value}
jakarta.validation.constraints.Max.message=Must be at most {value}
jakarta.validation.constraints.Positive.message=Must be greater than 0
jakarta.validation.constraints.PositiveOrZero.message=Must not be negative
jakarta.validation.constraints.AssertTrue.message=Must be true
org.hibernate.validator.constraints.URL.message=Must be a valid URL
