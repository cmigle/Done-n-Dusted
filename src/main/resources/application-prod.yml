server:
  port: ${PORT:8080}   # debesu platforma (pvz. Azure App Service) prievada gali nurodyti per PORT

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/donendusted}
    username: ${DB_USER:donendusted}
    password: ${DB_PASSWORD:donendusted}
    driver-class-name: org.postgresql.Driver

app:
  jwt:
    secret: ${JWT_SECRET}   # be numatytosios reiksmes: nenurodzius programa nepasileis
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}   # kliento adresai per kableli
