spring:
  application:
    name: done-n-dusted
  profiles:
    default: dev   # "default", ne "active": jei paleidziant nurodomas prod, jis laimi
  jpa:
    hibernate:
      ddl-auto: validate   # schema kuria Flyway; Hibernate tik patikrina, ar entity atitinka lenteles
    open-in-view: false    # DB sesija uzdaroma kartu su transakcija servise, ne HTTP atsakymo pabaigoje
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null   # null laukai (pvz. prev/next) i JSON neirasomi
    deserialization:
      fail-on-unknown-properties: true     # nezinomas laukas (pvz. xpAwarded kuriant irasa) -> 400
  data:
    web:
      pageable:
        max-page-size: 100   # ?size=100000 nesugriaus serverio - bus apkarpyta iki 100
        one-indexed-parameters: false

server:
  port: 8080
  error:
    include-message: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
