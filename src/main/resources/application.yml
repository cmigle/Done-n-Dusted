spring:
  application:
    name: done-n-dusted
  profiles:
    default: dev   # "default", ne "active": jei paleidziant nurodomas prod, jis laimi
  jpa:
    hibernate:
      ddl-auto: validate   # schema kuria Flyway; Hibernate tik patikrina, ar entity atitinka lenteles
    open-in-view: false    # DB sesija uzdaroma kartu su transakcija servise, ne HTTP atsakymo pabaigoje
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null   # null laukai (pvz. prev/next) i JSON neirasomi
    deserialization:
      fail-on-unknown-properties: true     # nezinomas laukas (pvz. xpAwarded kuriant irasa) -> 400
    datatype:
      enum:
        fail-on-numbers-for-enums: true    # "status": 1 nebereiskia APPROVED (enum eiles nr.) -> 400
  mvc:
    formcontent:
      filter:
        enabled: false   # API priima tik JSON; formos filtras blogai uzkoduota forma luzdavo dar pries sauguma (500)
  data:
    web:
      pageable:
        max-page-size: 100   # ?size=100000 nesugriaus serverio - bus apkarpyta iki 100
        one-indexed-parameters: false

server:
  port: 8080
  error:
    include-message: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true   # Swagger UI "Authorize" zetonas islieka perkrovus puslapi
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    issuer: done-n-dusted
    # Numatytasis raktas tik kurimo aplinkai. prod profilyje privalomas JWT_SECRET aplinkos kintamasis.
    secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-0123456789}
    access-token-ttl: 15m   # trumpas: atsijungus access zetonas dar galioja iki exp
    refresh-token-ttl: 7d
