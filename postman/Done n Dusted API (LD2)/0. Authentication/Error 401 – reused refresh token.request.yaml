$kind: http-request
description: The old refresh token has already been used. If someone sends it again, it was most likely stolen, so the server revokes **all** of the user's sessions.
url: "{{baseUrl}}/auth/refresh"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "refreshToken": "{{oldRefreshToken}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('401 Unauthorized', () => pm.response.to.have.status(401));
      pm.test('Reuse revokes all sessions', () => pm.expect(pm.response.json().message).to.include('All sessions have been revoked'));
    language: text/javascript
examples: ./.resources/Error 401 – reused refresh token.resources/examples
order: 10000
