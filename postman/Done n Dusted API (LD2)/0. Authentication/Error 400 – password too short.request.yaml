$kind: http-request
description: The password must be 8–72 characters. This is a field constraint, so the response is `400` with the field named in `details`.
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "{{username}}_2",
      "password": "123"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('400 Bad Request', () => pm.response.to.have.status(400));
      pm.test('Names the password field', () => pm.expect(pm.response.json().details.map(d => d.field)).to.include('password'));
    language: text/javascript
examples: ./.resources/Error 400 – password too short.resources/examples
order: 3000
