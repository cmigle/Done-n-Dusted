$kind: http-request
description: |-
  When the access token expires, the client gets a new pair without the password, in exchange for the refresh token. The old refresh token is revoked (rotation) and saved to `oldRefreshToken` for the next check.

  Method **#18** in the docs/API.md table.
url: "{{baseUrl}}/auth/refresh"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "refreshToken": "{{refreshToken}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      const old = pm.collectionVariables.get('refreshToken');
      pm.test('A new pair is issued - the refresh token is replaced', () => {
        pm.expect(body.refreshToken).to.be.a('string').and.not.eql(old);
        pm.expect(body.accessToken.split('.')).to.have.lengthOf(3);
      });
      pm.collectionVariables.set('oldRefreshToken', old);
      pm.collectionVariables.set('accessToken', body.accessToken);
      pm.collectionVariables.set('refreshToken', body.refreshToken);
    language: text/javascript
examples: ./.resources/Refresh tokens.resources/examples
order: 9000
