$kind: http-request
description: One letter is appended to the token, so the signature no longer matches. The server verifies every token itself, so it rejects a forged or altered one.
url: "{{baseUrl}}/guilds"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}x"
scripts:
  - type: afterResponse
    code: |-
      pm.test('401 Unauthorized', () => pm.response.to.have.status(401));
      pm.test('WWW-Authenticate says invalid_token', () => pm.expect(pm.response.headers.get('WWW-Authenticate')).to.include('invalid_token'));
      pm.test('ApiError message', () => pm.expect(pm.response.json().message).to.include('Invalid access token'));
    language: text/javascript
examples: ./.resources/Error 401 – tampered token.resources/examples
order: 8000
