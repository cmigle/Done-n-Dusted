$kind: http-request
description: "A wrong username and a wrong password return the same error, so it does not reveal whether the user exists. The `WWW-Authenticate: Bearer` header says which authentication is required."
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "{{username}}",
      "password": "neteisingas"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('401 Unauthorized', () => pm.response.to.have.status(401));
      pm.test('WWW-Authenticate header', () => pm.expect(pm.response.headers.get('WWW-Authenticate')).to.eql('Bearer'));
      pm.test('ApiError with a message', () => pm.expect(pm.response.json().message).to.include('Invalid username or password'));
    language: text/javascript
examples: ./.resources/Error 401 – wrong password.resources/examples
order: 4000
