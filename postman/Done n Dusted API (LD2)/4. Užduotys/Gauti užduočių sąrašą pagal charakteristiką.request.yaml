$kind: http-request
description: |-
  Grąžina grupės užduočių sąrašą.

  Galimi filtrai: `stat`, `type`, `difficulty`, `active`. Čia filtruojama pagal `stat=CON`.

  docs/API.md lentelės metodas **#6**.
url: "{{baseUrl}}/guilds/{{guildA}}/quests?stat=CON"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const quests = pm.response.json().content;
      pm.test('Filtras pagal stat suveike, ID: ' + quests.map(q => q.id).join(', '), () => {
        pm.expect(quests).to.have.lengthOf(1);
        pm.expect(quests[0].stat).to.eql('CON');
        pm.expect(quests[0].id).to.eql(Number(pm.collectionVariables.get('questId')));
      });
      pm.test('Uzduotis priklauso A grupei', () => pm.expect(quests[0].guildId).to.eql(Number(pm.collectionVariables.get('guildA'))));
    language: text/javascript
examples: ./.resources/Gauti užduočių sąrašą pagal charakteristiką.resources/examples
order: 3000
