$kind: http-request
description: |-
  Grąžina vieną grupę pagal ID.

  docs/API.md lentelės metodas **#2**.
url: "{{baseUrl}}/guilds/{{guildA}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('Grazinta ta pati grupe', () => pm.expect(pm.response.json().id).to.eql(Number(pm.collectionVariables.get('guildA'))));
    language: text/javascript
examples: ./.resources/Gauti grupę pagal ID.resources/examples
order: 6000
