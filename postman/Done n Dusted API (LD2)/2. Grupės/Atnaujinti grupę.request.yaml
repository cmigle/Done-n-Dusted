$kind: http-request
description: |-
  Dalinai atnaujina grupę (`PATCH`): siunčiamas tik `description`. Neatsiųsti laukai (`name`) lieka nepakeisti.

  docs/API.md lentelės metodas **#4**.
url: "{{baseUrl}}/guilds/{{guildA}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "description": "Aprasymas po redagavimo"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Pakeitimas issaugotas', () => pm.expect(body.description).to.eql('Aprasymas po redagavimo'));
      pm.test('Neatsiustas pavadinimas nepakito', () => pm.expect(body.name).to.eql(pm.collectionVariables.get('guildName')));
    language: text/javascript
examples: ./.resources/Atnaujinti grupę.resources/examples
order: 7000
