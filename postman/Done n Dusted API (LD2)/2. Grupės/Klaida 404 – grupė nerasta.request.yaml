$kind: http-request
description: Neegzistuojančiai grupei grąžinamas `404 Not Found`, o pranešime nurodomas ieškotas ID.
url: "{{baseUrl}}/guilds/999999"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('404 Not Found', () => pm.response.to.have.status(404));
      pm.test('ApiError su prasmingu pranesimu', () => {
        const e = pm.response.json();
        pm.expect(e.status).to.eql(404);
        pm.expect(e.message).to.include('999999');
      });
    language: text/javascript
examples: ./.resources/Klaida 404 – grupė nerasta.resources/examples
order: 12000
