$kind: http-request
description: |-
  Grąžina grupes, kurių narys yra prisijungęs naudotojas — naujas naudotojas mato tik dvi savo sukurtas. Administratorius mato visas (žr. `1. Suvestinė`). Numatytieji parametrai (iki 20 grupių puslapyje, rikiuojama pagal pavadinimą).

  * `name` filtruoja pagal pavadinimo dalį.
  * `page`, `size` ir `sort` (pvz. `sort=name,asc`) valdo puslapiavimą. Didžiausias `size` yra 100.

  Puslapiavimas atskirai parodomas dviejose kitose užklausose.

  README lentelės metodas **#1**.
url: "{{baseUrl}}/guilds"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const guilds = pm.response.json().content;
      const ids = guilds.map(g => g.id);
      pm.test('Naudotojas mato tik savo grupes, ID: ' + [...ids].sort((a, b) => a - b).join(', '), () => {
        const mine = [Number(pm.collectionVariables.get('guildA')), Number(pm.collectionVariables.get('guildB'))];
        pm.expect([...ids].sort((a, b) => a - b)).to.eql(mine.sort((a, b) => a - b));
        pm.expect(pm.response.json().totalElements).to.eql(2);
      });
      pm.test('Kiekviena grupe turi id, pavadinima ir aprasyma', () => {
        guilds.forEach(g => {
          pm.expect(g.id).to.be.a('number');
          pm.expect(g.name).to.be.a('string');
          pm.expect(g.description).to.be.a('string');
        });
      });
    language: text/javascript
examples: ./.resources/Gauti grupių sąrašą.resources/examples
order: 3000
