$kind: http-request
description: |-
  Returns one quest through its parent guild.

  Method **#7** in the docs/API.md table.
url: "{{baseUrl}}/guilds/{{guildA}}/quests/{{questId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('The same quest', () => pm.expect(pm.response.json().id).to.eql(Number(pm.collectionVariables.get('questId'))));
    language: text/javascript
examples: ./.resources/Get quest by ID.resources/examples
order: 4000
