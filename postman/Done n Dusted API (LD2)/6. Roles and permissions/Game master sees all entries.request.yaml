$kind: http-request
description: The game master sees both the player's log entries and their own.
url: "{{baseUrl}}/guilds/{{guildA}}/quests/{{questId}}/logs"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const ids = pm.response.json().content.map(x => x.id);
      pm.test('Both log entries are visible, IDs: ' + ids.join(', '), () => {
        pm.expect(ids).to.include(Number(pm.collectionVariables.get('logPlayer')));
        pm.expect(ids).to.include(Number(pm.collectionVariables.get('logDm')));
      });
    language: text/javascript
examples: ./.resources/Game master sees all entries.resources/examples
order: 9000
