$kind: http-request
description: "`/auth/me` žaidėjo vardu: jonas mato visas savo grupes ir rolę kiekvienoje, tarp jų ir naują `guildA`."
url: "{{baseUrl}}/auth/me"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{playerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const memberships = pm.response.json().memberships;
      pm.test('Naujoje grupeje jonas - PLAYER', () => {
        const m = memberships.find(x => x.guildId === Number(pm.collectionVariables.get('guildA')));
        pm.expect(m).to.not.be.undefined;
        pm.expect(m.role).to.eql('PLAYER');
      });
    language: text/javascript
examples: ./.resources/Žaidėjo narystės.resources/examples
order: 9000
