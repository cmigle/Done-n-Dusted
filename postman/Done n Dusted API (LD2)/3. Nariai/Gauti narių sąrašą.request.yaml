$kind: http-request
description: |-
  Grupės kūrėjas automatiškai tampa jos nariu su role `DUNGEON_MASTER`.

  README lentelės metodas **#21**.
url: "{{baseUrl}}/guilds/{{guildA}}/members"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const members = pm.response.json().content;
      pm.test('Vienintelis narys - kurejas, jo role DUNGEON_MASTER', () => {
        pm.expect(members).to.have.lengthOf(1);
        pm.expect(members[0].userId).to.eql(Number(pm.collectionVariables.get('userId')));
        pm.expect(members[0].role).to.eql('DUNGEON_MASTER');
      });
    language: text/javascript
examples: ./.resources/Gauti narių sąrašą.resources/examples
order: 1000
