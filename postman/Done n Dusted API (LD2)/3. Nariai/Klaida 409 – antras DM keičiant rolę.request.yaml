$kind: http-request
description: |-
  Rolės keitimas (`PATCH`) tikrina tą pačią taisyklę: kol grupėje yra DM, kito paskirti negalima.

  docs/API.md lentelės metodas **#24**.
url: "{{baseUrl}}/guilds/{{guildA}}/members/{{playerId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "role": "DUNGEON_MASTER"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('409 Conflict', () => pm.response.to.have.status(409));
      pm.test('Antras DM neleidziamas', () => pm.expect(pm.response.json().message).to.include('jau turi DM'));
    language: text/javascript
examples: ./.resources/Klaida 409 – antras DM keičiant rolę.resources/examples
order: 8000
