$kind: http-request
description: Žaidėjas `jonas` yra grupės narys, bet ne savininkas — narių pridėti negali.
url: "{{baseUrl}}/guilds/{{guildA}}/members"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "ieva",
      "role": "PLAYER"
    }
auth:
  type: bearer
  credentials:
    token: "{{playerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('403 Forbidden', () => pm.response.to.have.status(403));
      pm.test('Paaiskinama, kas turi teise', () => pm.expect(pm.response.json().message).to.include('savininkas'));
    language: text/javascript
examples: ./.resources/Klaida 403 – žaidėjas negali pridėti nario.resources/examples
order: 7000
