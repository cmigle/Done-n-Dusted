$kind: http-request
description: |-
  Vienas narys pagal naudotojo ID.

  README lentelės metodas **#22**.
url: "{{baseUrl}}/guilds/{{guildA}}/members/{{playerId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('Tas pats narys su role', () => {
        const body = pm.response.json();
        pm.expect(body.username).to.eql('jonas');
        pm.expect(body.role).to.eql('PLAYER');
      });
    language: text/javascript
examples: ./.resources/Gauti narį pagal ID.resources/examples
order: 3000
