$kind: http-request
description: Tas pats naudotojas grupėje gali būti tik kartą.
url: "{{baseUrl}}/guilds/{{guildA}}/members"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "jonas",
      "role": "PLAYER"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('409 Conflict', () => pm.response.to.have.status(409));
      pm.test('Pranesimas paaiskina konflikta', () => pm.expect(pm.response.json().message).to.include('jau yra grupes narys'));
    language: text/javascript
examples: ./.resources/Klaida 409 – jau narys.resources/examples
order: 4000
