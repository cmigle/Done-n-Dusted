$kind: http-request
description: Grupė jau turi DM (jos kūrėją), todėl antro paskirti negalima.
url: "{{baseUrl}}/guilds/{{guildA}}/members"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "ieva",
      "role": "DUNGEON_MASTER"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('409 Conflict', () => pm.response.to.have.status(409));
      pm.test('Vienas DM grupeje', () => pm.expect(pm.response.json().message).to.include('already has a game master'));
    language: text/javascript
examples: ./.resources/Klaida 409 – grupėje jau yra DM.resources/examples
order: 5000
