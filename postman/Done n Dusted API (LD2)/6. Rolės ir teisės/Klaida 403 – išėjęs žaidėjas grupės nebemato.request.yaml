$kind: http-request
description: Išėjęs iš grupės, jonas nebemato nei jos, nei jos užduočių ir įrašų.
url: "{{baseUrl}}/guilds/{{guildA}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{playerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('403 Forbidden', () => pm.response.to.have.status(403));
      pm.test('Nebe narys - 403', () => pm.expect(pm.response.json().message).to.include('narys'));
    language: text/javascript
examples: ./.resources/Klaida 403 – išėjęs žaidėjas grupės nebemato.resources/examples
order: 14000
