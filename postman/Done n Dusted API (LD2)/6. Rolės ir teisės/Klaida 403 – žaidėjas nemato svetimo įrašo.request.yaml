$kind: http-request
description: Žaidėjas mato tik savo įrašus; svetimus — tik grupės DM.
url: "{{baseUrl}}/guilds/{{guildA}}/quests/{{questId}}/logs/{{logDm}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{playerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('403 Forbidden', () => pm.response.to.have.status(403));
      pm.test('Svetimus irasus mato tik DM', () => pm.expect(pm.response.json().message).to.include('tik grupes DM'));
    language: text/javascript
examples: ./.resources/Klaida 403 – žaidėjas nemato svetimo įrašo.resources/examples
order: 7000
