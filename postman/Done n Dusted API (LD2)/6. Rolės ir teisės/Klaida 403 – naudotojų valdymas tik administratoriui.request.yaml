$kind: http-request
description: "`/api/users/**` leidžiama tik rolei `ADMIN` (tikrinama Spring Security lygiu, dar prieš kontrolerį)."
url: "{{baseUrl}}/users"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('403 Forbidden', () => pm.response.to.have.status(403));
      pm.test('Ne ADMIN - 403', () => pm.expect(pm.response.json().message).to.include('Neturite teises'));
    language: text/javascript
examples: ./.resources/Klaida 403 – naudotojų valdymas tik administratoriui.resources/examples
order: 12000
