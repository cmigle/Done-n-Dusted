$kind: http-request
description: Naujas `PENDING` įrašas, kurį žaidėjas bandys patvirtinti pats. ID išsaugomas `logPlayer`.
url: "{{baseUrl}}/guilds/{{guildA}}/quests/{{questId}}/logs"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "note": "Antras zaidejo irasas",
      "occurredAt": "{{occurredAt}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{playerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('201 Created', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('logPlayer', pm.response.json().id);
    language: text/javascript
examples: ./.resources/Žaidėjas registruoja įrašą.resources/examples
order: 2000
