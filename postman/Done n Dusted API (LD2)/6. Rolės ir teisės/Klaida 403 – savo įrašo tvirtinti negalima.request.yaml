$kind: http-request
description: "LD0 taisyklė: įrašo negali tvirtinti jo autorius, **net jei jis yra DM**."
url: "{{baseUrl}}/guilds/{{guildA}}/quests/{{questId}}/logs/{{logDm}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "APPROVED"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('403 Forbidden', () => pm.response.to.have.status(403));
      pm.test('Savo iraso tvirtinti negalima', () => pm.expect(pm.response.json().message).to.include('Savo iraso'));
    language: text/javascript
examples: ./.resources/Klaida 403 – savo įrašo tvirtinti negalima.resources/examples
order: 6000
