$kind: http-request
description: "Ankstesnės užklausos pasekmė: net ką tik gautas refresh žetonas nebegalioja. Naudotojas turi prisijungti iš naujo."
url: "{{baseUrl}}/auth/refresh"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "refreshToken": "{{refreshToken}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('401 Unauthorized', () => pm.response.to.have.status(401));
      pm.test('Ir naujausias refresh zetonas atsauktas', () => pm.expect(pm.response.json().message).to.include('atsaukt'));
    language: text/javascript
examples: ./.resources/Klaida 401 – atšauktas ir naujasis žetonas.resources/examples
order: 11000
