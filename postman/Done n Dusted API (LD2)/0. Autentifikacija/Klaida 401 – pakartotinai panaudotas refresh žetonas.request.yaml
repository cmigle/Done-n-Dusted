$kind: http-request
description: Senasis refresh žetonas jau panaudotas. Jei jį kas nors atsiunčia dar kartą, greičiausiai jis pavogtas, todėl serveris atšaukia **visas** naudotojo sesijas.
url: "{{baseUrl}}/auth/refresh"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "refreshToken": "{{oldRefreshToken}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('401 Unauthorized', () => pm.response.to.have.status(401));
      pm.test('Pakartotinis panaudojimas atsaukia visas sesijas', () => pm.expect(pm.response.json().message).to.include('All sessions have been revoked'));
    language: text/javascript
examples: ./.resources/Klaida 401 – pakartotinai panaudotas refresh žetonas.resources/examples
order: 10000
