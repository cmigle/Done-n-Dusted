$kind: http-request
description: "Ta pati klaida grąžinama ir neteisingam vardui, ir slaptažodžiui — neatskleidžiama, ar toks naudotojas egzistuoja. Antraštė `WWW-Authenticate: Bearer` nurodo, kokio autentifikavimo reikia."
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "{{username}}",
      "password": "neteisingas"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('401 Unauthorized', () => pm.response.to.have.status(401));
      pm.test('WWW-Authenticate antraste', () => pm.expect(pm.response.headers.get('WWW-Authenticate')).to.eql('Bearer'));
      pm.test('ApiError su pranesimu', () => pm.expect(pm.response.json().message).to.include('Neteisingas'));
    language: text/javascript
examples: ./.resources/Klaida 401 – neteisingas slaptažodis.resources/examples
order: 4000
