$kind: http-request
description: |-
  Kai access žetonas pasibaigia, klientas nauja pora gauna be slaptažodžio — už refresh žetoną. Senasis refresh žetonas atšaukiamas (rotacija) ir išsaugomas `oldRefreshToken` kitai patikrai.

  README lentelės metodas **#18**.
url: "{{baseUrl}}/auth/refresh"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "refreshToken": "{{refreshToken}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      const old = pm.collectionVariables.get('refreshToken');
      pm.test('Isduota nauja pora - refresh zetonas pakeistas nauju', () => {
        pm.expect(body.refreshToken).to.be.a('string').and.not.eql(old);
        pm.expect(body.accessToken.split('.')).to.have.lengthOf(3);
      });
      pm.collectionVariables.set('oldRefreshToken', old);
      pm.collectionVariables.set('accessToken', body.accessToken);
      pm.collectionVariables.set('refreshToken', body.refreshToken);
    language: text/javascript
examples: ./.resources/Atnaujinti žetonus.resources/examples
order: 9000
