$kind: http-request
description: Slaptažodis turi būti 8–72 simbolių. Lauko apribojimas, todėl `400` su konkrečiu lauku `details`.
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "{{username}}_2",
      "password": "123"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('400 Bad Request', () => pm.response.to.have.status(400));
      pm.test('Nurodomas laukas password', () => pm.expect(pm.response.json().details.map(d => d.field)).to.include('password'));
    language: text/javascript
examples: ./.resources/Klaida 400 – per trumpas slaptažodis.resources/examples
order: 3000
