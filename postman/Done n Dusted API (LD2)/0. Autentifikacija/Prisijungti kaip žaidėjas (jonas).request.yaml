$kind: http-request
description: Demonstracinis naudotojas `jonas`. Jo žetonas `playerToken` naudojamas užklausose, kurias atlieka grupės žaidėjas (`PLAYER`).
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "jonas",
      "password": "{{password}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      const b64 = body.accessToken.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      const claims = JSON.parse(atob(b64 + '==='.slice((b64.length + 3) % 4)));
      pm.test('jonas - iprastas naudotojas (USER)', () => pm.expect(claims.role).to.eql('USER'));
      pm.collectionVariables.set('playerToken', body.accessToken);
      pm.collectionVariables.set('playerId', Number(claims.sub));
    language: text/javascript
examples: ./.resources/Prisijungti kaip žaidėjas (jonas).resources/examples
order: 16000
