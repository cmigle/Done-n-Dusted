$kind: http-request
description: |-
  Grąžina žetonų porą:

  * `accessToken` — pasirašytas JWT (HS256), galioja **15 min** (`expiresIn: 900`). Jame: `sub` (naudotojo ID), `username`, `role`, `iss`, `iat`, `exp`.
  * `refreshToken` — atsitiktinė eilutė, ne JWT. DB saugoma tik jos SHA-256 maiša.

  Testas iškoduoja JWT ir patikrina jo turinį. Abu žetonai išsaugomi kintamuosiuose.

  README lentelės metodas **#17**.
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "{{username}}",
      "password": "{{password}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      const b64 = body.accessToken.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      const claims = JSON.parse(atob(b64 + '==='.slice((b64.length + 3) % 4)));
      pm.test('Access zetonas - JWT is 3 daliu, tipas Bearer, galioja 15 min', () => {
        pm.expect(body.accessToken.split('.')).to.have.lengthOf(3);
        pm.expect(body.tokenType).to.eql('Bearer');
        pm.expect(body.expiresIn).to.eql(900);
        pm.expect(claims.exp - claims.iat).to.eql(900);
      });
      pm.test('JWT turinys: sub = naudotojo ID, role USER', () => {
        pm.expect(claims.sub).to.eql(String(pm.collectionVariables.get('userId')));
        pm.expect(claims.username).to.eql(pm.collectionVariables.get('username'));
        pm.expect(claims.role).to.eql('USER');
        pm.expect(claims.iss).to.eql('done-n-dusted');
      });
      pm.test('Refresh zetonas - atsitiktine eilute, ne JWT', () => pm.expect(body.refreshToken).to.be.a('string').and.not.include('.'));
      pm.collectionVariables.set('accessToken', body.accessToken);
      pm.collectionVariables.set('refreshToken', body.refreshToken);
    language: text/javascript
examples: ./.resources/Prisijungti.resources/examples
order: 5000
