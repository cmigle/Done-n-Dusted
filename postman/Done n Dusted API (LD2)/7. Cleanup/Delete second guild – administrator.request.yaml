$kind: http-request
description: "Guild B is deleted by an **administrator** who is not a member: `ADMIN` can remove inappropriate content in any guild."
url: "{{baseUrl}}/guilds/{{guildB}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('204 No Content', () => pm.response.to.have.status(204));
    language: text/javascript
examples: ./.resources/Delete second guild – administrator.resources/examples
order: 3000
