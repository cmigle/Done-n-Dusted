$kind: http-request
description: Checks that the deleted guild is no longer reachable (`404 Not Found`).
url: "{{baseUrl}}/guilds/{{guildA}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('404 Not Found', () => pm.response.to.have.status(404));
      pm.test('The resource is gone after deletion', () => pm.expect(pm.response.json().status).to.eql(404));
    language: text/javascript
examples: ./.resources/Error 404 – deleted guild not found.resources/examples
order: 4000
