$kind: http-request
description: |-
  Deletes the quest together with all its log entries (`204 No Content`).

  Method **#10** in the docs/API.md table.
url: "{{baseUrl}}/guilds/{{guildA}}/quests/{{questId}}"
method: DELETE
scripts:
  - type: afterResponse
    code: pm.test('204 No Content', () => pm.response.to.have.status(204));
    language: text/javascript
examples: ./.resources/Delete quest.resources/examples
order: 1000
