$kind: http-request
description: "Apsauga nuo situacijos, kai neliktų nė vieno administratoriaus: savo ADMIN teisių nuimti ar savęs užblokuoti negalima."
url: "{{baseUrl}}/users/{{adminId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "enabled": false
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('422 Unprocessable Entity', () => pm.response.to.have.status(422));
      pm.test('Saves uzblokuoti negalima', () => pm.expect(pm.response.json().message).to.include('Savo'));
    language: text/javascript
examples: ./.resources/Klaida 422 – savęs užblokuoti negalima.resources/examples
order: 3000
