$kind: http-request
description: |-
  Užblokuojama kolekcijos naudotojo paskyra: atšaukiami visi jo refresh žetonai.

  README lentelės metodas **#28**.
url: "{{baseUrl}}/users/{{userId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "enabled": false
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('Paskyra uzblokuota', () => pm.expect(pm.response.json().enabled).to.eql(false));
    language: text/javascript
examples: ./.resources/Užblokuoti naudotoją.resources/examples
order: 4000
