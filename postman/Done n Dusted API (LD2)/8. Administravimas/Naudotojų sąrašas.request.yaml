$kind: http-request
description: |-
  Puslapiuotas sąrašas su filtru pagal vardo dalį. Slaptažodžių maišos negrąžinamos.

  README lentelės metodas **#26**.
url: "{{baseUrl}}/users?username={{username}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Rastas kolekcijos naudotojas', () => {
        pm.expect(body.totalElements).to.eql(1);
        pm.expect(body.content[0].id).to.eql(Number(pm.collectionVariables.get('userId')));
        pm.expect(body.content[0]).to.not.have.property('passwordHash');
      });
    language: text/javascript
examples: ./.resources/Naudotojų sąrašas.resources/examples
order: 1000
