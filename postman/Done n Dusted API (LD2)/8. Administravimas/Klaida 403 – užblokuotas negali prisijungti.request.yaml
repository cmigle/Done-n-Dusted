$kind: http-request
description: Slaptažodis teisingas, bet paskyra užblokuota — `403`, ne `401`.
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "{{username}}",
      "password": "{{password}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('403 Forbidden', () => pm.response.to.have.status(403));
      pm.test('Pranesimas apie uzblokuota paskyra', () => pm.expect(pm.response.json().message).to.include('uzblokuota'));
    language: text/javascript
examples: ./.resources/Klaida 403 – užblokuotas negali prisijungti.resources/examples
order: 5000
