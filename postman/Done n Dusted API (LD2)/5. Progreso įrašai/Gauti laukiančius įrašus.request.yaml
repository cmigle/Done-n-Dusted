$kind: http-request
description: |-
  Grąžina užduoties įrašų sąrašą.

  Filtras `status` gali būti `PENDING`, `APPROVED` arba `REJECTED`. Čia ieškoma įrašų, kurie dar laukia peržiūros.

  docs/API.md lentelės metodas **#11**.

  Siunčia grupės DM — jis mato visų žaidėjų įrašus. Žaidėjas matytų tik savo (žr. `6. Rolės ir teisės`).
url: "{{baseUrl}}/guilds/{{guildA}}/quests/{{questId}}/logs?status=PENDING"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const logs = pm.response.json().content;
      pm.test('Rastas vienas PENDING irasas, ID: ' + logs.map(l => l.id).join(', '), () => {
        pm.expect(logs).to.have.lengthOf(1);
        pm.expect(logs[0].status).to.eql('PENDING');
        pm.expect(logs[0].id).to.eql(Number(pm.collectionVariables.get('logId')));
      });
      pm.test('Irasas priklauso sukurtai uzduociai', () => pm.expect(logs[0].questId).to.eql(Number(pm.collectionVariables.get('questId'))));
    language: text/javascript
examples: ./.resources/Gauti laukiančius įrašus.resources/examples
order: 3000
