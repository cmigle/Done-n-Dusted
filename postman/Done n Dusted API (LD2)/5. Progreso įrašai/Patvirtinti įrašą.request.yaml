$kind: http-request
description: |-
  Grupės Dungeon Master (kolekcijos naudotojas) patvirtina žaidėjo įrašą (`PATCH`): siunčiami tik peržiūros laukai `status = APPROVED`, `inspirationAwarded = 1` ir `reviewerNote`. Įrašo turinys (`note`, `evidenceUrl`, `occurredAt`) lieka nepakeistas.

  `xpAwarded` nesiunčiamas, todėl serveris jį paima iš užduoties sudėtingumo (`LEGENDARY` = **80**). Užpildomi `reviewedAt` ir `reviewerId`. Peržiūros laukus keisti gali tik grupės DM.

  README lentelės metodas **#14**.
url: "{{baseUrl}}/guilds/{{guildA}}/quests/{{questId}}/logs/{{logId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "APPROVED",
      "inspirationAwarded": 1,
      "reviewerNote": "Uzskaitau, nuotrauka aiski"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('XP paimtas is uzduoties sudetingumo, nors klientas jo nepadave', () => {
        pm.expect(body.status).to.eql('APPROVED');
        pm.expect(body.xpAwarded).to.eql(80);
        pm.expect(body.inspirationAwarded).to.eql(1);
        pm.expect(body.reviewedAt).to.be.a('string');
      });
      pm.test('Neatsiusti laukai (note, evidenceUrl) nepakito', () => {
        pm.expect(body.note).to.eql('Nubegau 10 km per 52 minutes');
        pm.expect(body.evidenceUrl).to.eql('https://example.org/evidence/run.png');
      });
      pm.test('Patvirtino DM, o ne iraso autorius', () => {
        pm.expect(body.reviewerId).to.eql(Number(pm.collectionVariables.get('userId')));
        pm.expect(body.authorId).to.eql(Number(pm.collectionVariables.get('playerId')));
      });
    language: text/javascript
examples: ./.resources/Patvirtinti įrašą.resources/examples
order: 5000
