$kind: http-request
description: "`occurredAt` nurodytas ateityje (2099 m.). Tai dalykinės taisyklės pažeidimas, todėl grąžinamas `422 Unprocessable Entity`."
url: "{{baseUrl}}/guilds/{{guildA}}/quests/{{questId}}/logs"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "occurredAt": "2099-01-01T00:00:00Z"
    }
auth:
  type: bearer
  credentials:
    token: "{{playerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('422 Unprocessable Entity', () => pm.response.to.have.status(422));
      pm.test('Pranesimas apie occurredAt', () => pm.expect(pm.response.json().message).to.include('occurredAt'));
    language: text/javascript
examples: ./.resources/Klaida 422 – įvykio data ateityje.resources/examples
order: 2000
