$kind: http-request
description: |-
  The player `jonas` (`playerToken`) logs progress on the quest, and the log entry's ID is saved to `logId`.

  A new log entry is always `PENDING`, with `xpAwarded = 0` and `inspirationAwarded = 0`. `occurredAt` cannot be in the future.

  Method **#13** in the docs/API.md table.
url: "{{baseUrl}}/guilds/{{guildA}}/quests/{{questId}}/logs"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "note": "Ran 10 km in 52 minutes",
      "evidenceUrl": "https://example.org/evidence/run.png",
      "occurredAt": "{{occurredAt}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{playerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('201 Created', () => pm.response.to.have.status(201));
      const body = pm.response.json();
      pm.test('A new log entry is always PENDING with no points', () => {
        pm.expect(body.status).to.eql('PENDING');
        pm.expect(body.xpAwarded).to.eql(0);
        pm.expect(body.inspirationAwarded).to.eql(0);
        pm.expect(body.reviewedAt).to.be.undefined;
      });
      pm.test('The log entry belongs to the created quest', () => pm.expect(body.questId).to.eql(Number(pm.collectionVariables.get('questId'))));
      pm.test('The author is the player jonas', () => pm.expect(body.authorId).to.eql(Number(pm.collectionVariables.get('playerId'))));
      pm.collectionVariables.set('logId', body.id);
    language: text/javascript
examples: ./.resources/Log progress.resources/examples
order: 1000
