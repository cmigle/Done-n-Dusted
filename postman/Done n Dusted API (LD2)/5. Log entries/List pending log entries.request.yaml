$kind: http-request
description: |-
  Returns the quest's log entries.

  The `status` filter can be `PENDING`, `APPROVED` or `REJECTED`. Here it looks for log entries still waiting for review.

  Method **#11** in the docs/API.md table.

  Sent by the guild's game master, who sees every player's log entries. A player would see only their own (see `6. Roles and permissions`).
url: "{{baseUrl}}/guilds/{{guildA}}/quests/{{questId}}/logs?status=PENDING"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const logs = pm.response.json().content;
      pm.test('Found one PENDING log entry, IDs: ' + logs.map(l => l.id).join(', '), () => {
        pm.expect(logs).to.have.lengthOf(1);
        pm.expect(logs[0].status).to.eql('PENDING');
        pm.expect(logs[0].id).to.eql(Number(pm.collectionVariables.get('logId')));
      });
      pm.test('The log entry belongs to the created quest', () => pm.expect(logs[0].questId).to.eql(Number(pm.collectionVariables.get('questId'))));
    language: text/javascript
examples: ./.resources/List pending log entries.resources/examples
order: 3000
