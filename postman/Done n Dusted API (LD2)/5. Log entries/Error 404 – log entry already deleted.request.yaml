$kind: http-request
description: Deleting the same log entry again returns `404 Not Found`.
url: "{{baseUrl}}/guilds/{{guildA}}/quests/{{questId}}/logs/{{logId}}"
method: DELETE
scripts:
  - type: afterResponse
    code: pm.test('404 Not Found', () => pm.response.to.have.status(404));
    language: text/javascript
examples: ./.resources/Error 404 – log entry already deleted.resources/examples
order: 9000
