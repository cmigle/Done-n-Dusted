$kind: http-request
description: The name `ab` breaks a field constraint, so the response is `400 Bad Request`. The `details` array names the exact field (`name`).
url: "{{baseUrl}}/guilds"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "ab"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('400 Bad Request', () => pm.response.to.have.status(400));
      const e = pm.response.json();
      pm.test('Names the exact field', () => {
        pm.expect(e.details).to.be.an('array').that.is.not.empty;
        pm.expect(e.details[0].field).to.eql('name');
      });
    language: text/javascript
examples: ./.resources/Error 400 – name too short.resources/examples
order: 9000
