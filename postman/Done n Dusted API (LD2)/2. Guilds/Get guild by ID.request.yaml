$kind: http-request
description: |-
  Returns one guild by ID.

  Method **#2** in the docs/API.md table.
url: "{{baseUrl}}/guilds/{{guildA}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('Returns the same guild', () => pm.expect(pm.response.json().id).to.eql(Number(pm.collectionVariables.get('guildA'))));
    language: text/javascript
examples: ./.resources/Get guild by ID.resources/examples
order: 6000
