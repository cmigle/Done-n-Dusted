$kind: http-request
description: A guild that does not exist returns `404 Not Found`, and the message names the ID that was looked up.
url: "{{baseUrl}}/guilds/999999"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('404 Not Found', () => pm.response.to.have.status(404));
      pm.test('ApiError with a meaningful message', () => {
        const e = pm.response.json();
        pm.expect(e.status).to.eql(404);
        pm.expect(e.message).to.include('999999');
      });
    language: text/javascript
examples: ./.resources/Error 404 – guild not found.resources/examples
order: 12000
