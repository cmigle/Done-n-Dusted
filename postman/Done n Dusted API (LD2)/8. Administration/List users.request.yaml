$kind: http-request
description: |-
  A paged list with a filter by part of the username. Password hashes are never returned.

  Method **#26** in the docs/API.md table.
url: "{{baseUrl}}/users?username={{username}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Finds the collection user', () => {
        pm.expect(body.totalElements).to.eql(1);
        pm.expect(body.content[0].id).to.eql(Number(pm.collectionVariables.get('userId')));
        pm.expect(body.content[0]).to.not.have.property('passwordHash');
      });
    language: text/javascript
examples: ./.resources/List users.resources/examples
order: 1000
