$kind: http-request
description: Užklausoje yra nedeklaruotas laukas `xpAwarded`. Serveris tokių laukų neignoruoja, o atmeta užklausą su `400 Bad Request`.
url: "{{baseUrl}}/guilds"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "{{guildName}} (C)",
      "xpAwarded": 9999
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('400 Bad Request', () => pm.response.to.have.status(400));
      pm.test('Serveris atmeta nedeklaruotus laukus', () => pm.expect(pm.response.json().message).to.include('xpAwarded'));
    language: text/javascript
examples: ./.resources/Klaida 400 – nežinomas laukas.resources/examples
order: 11000
