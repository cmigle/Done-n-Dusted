$kind: http-request
description: |-
  Sukuria naują grupę. Ją sukūręs naudotojas tampa grupės **savininku** (`ownerId`) ir jos **DM**.

  Prieš užklausą sugeneruojamas unikalus pavadinimas `Postman Guild <laikas>`, kad kolekciją būtų galima leisti kartotinai. Atsakymas yra `201 Created` su `Location` antrašte, o naujos grupės ID išsaugomas kintamajame `guildA`.

  docs/API.md lentelės metodas **#3**.
url: "{{baseUrl}}/guilds"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "{{guildName}}",
      "description": "Postman demonstracijai sukurta grupe"
    }
scripts:
  - type: beforeRequest
    code: |-
      pm.collectionVariables.set('guildName', 'Postman Guild ' + Date.now());
      pm.collectionVariables.set('occurredAt', new Date(Date.now() - 3600000).toISOString());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('201 Created', () => pm.response.to.have.status(201));
      pm.test('Location antraste nurodo nauja resursa', () => {
        pm.expect(pm.response.headers.get('Location')).to.include('/api/guilds/');
      });
      pm.test('JSON turinio tipas', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      const body = pm.response.json();
      pm.test('Grazintas sukurtas resursas su id ir createdAt', () => {
        pm.expect(body.id).to.be.a('number');
        pm.expect(body.name).to.eql(pm.collectionVariables.get('guildName'));
        pm.expect(body.createdAt).to.be.a('string');
      });
      pm.test('Kurejas tampa grupes savininku', () => pm.expect(body.ownerId).to.eql(Number(pm.collectionVariables.get('userId'))));
      pm.collectionVariables.set('guildA', body.id);
    language: text/javascript
examples: ./.resources/Sukurti grupę.resources/examples
order: 1000
