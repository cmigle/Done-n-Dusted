$kind: http-request
description: DM tvirtina, bet žaidėjo pastabos ir įrodymų perrašyti negali — turinį keičia tik autorius.
url: "{{baseUrl}}/guilds/{{guildA}}/quests/{{questId}}/logs/{{logPlayer}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "note": "DM perrase pastaba"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('403 Forbidden', () => pm.response.to.have.status(403));
      pm.test('Turini keicia tik autorius', () => pm.expect(pm.response.json().message).to.include('Only the author'));
    language: text/javascript
examples: ./.resources/Klaida 403 – DM nekeičia žaidėjo įrašo turinio.resources/examples
order: 4000
