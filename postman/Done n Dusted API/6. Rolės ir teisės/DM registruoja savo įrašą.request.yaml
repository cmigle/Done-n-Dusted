$kind: http-request
description: DM taip pat gali registruoti progresą. ID išsaugomas `logDm`.
url: "{{baseUrl}}/guilds/{{guildA}}/quests/{{questId}}/logs"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "note": "DM irasas apie save",
      "occurredAt": "{{occurredAt}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('201 Created', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('logDm', pm.response.json().id);
    language: text/javascript
examples: ./.resources/DM registruoja savo įrašą.resources/examples
order: 5000
