$kind: http-request
description: DM mato ir žaidėjo, ir savo įrašus.
url: "{{baseUrl}}/guilds/{{guildA}}/quests/{{questId}}/logs"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const ids = pm.response.json().content.map(x => x.id);
      pm.test('Matomi abu irasai, ID: ' + ids.join(', '), () => {
        pm.expect(ids).to.include(Number(pm.collectionVariables.get('logPlayer')));
        pm.expect(ids).to.include(Number(pm.collectionVariables.get('logDm')));
      });
    language: text/javascript
examples: ./.resources/DM mato visus įrašus.resources/examples
order: 9000
