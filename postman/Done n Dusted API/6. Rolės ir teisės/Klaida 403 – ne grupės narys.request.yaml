$kind: http-request
description: Grupė 2 (*Iron Vow*) egzistuoja, bet kolekcijos naudotojas nėra jos narys.
url: "{{baseUrl}}/guilds/2"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('403 Forbidden', () => pm.response.to.have.status(403));
      pm.test('Paaiskinama, kad naudotojas ne narys', () => pm.expect(pm.response.json().message).to.include('not a member'));
    language: text/javascript
examples: ./.resources/Klaida 403 – ne grupės narys.resources/examples
order: 1000
