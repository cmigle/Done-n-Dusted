$kind: http-request
description: "Grupę B ištrina **administratorius**, nors nėra jos narys: `ADMIN` gali šalinti netinkamą turinį bet kurioje grupėje."
url: "{{baseUrl}}/guilds/{{guildB}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('204 No Content', () => pm.response.to.have.status(204));
    language: text/javascript
examples: ./.resources/Ištrinti antrą grupę – administratorius.resources/examples
order: 3000
