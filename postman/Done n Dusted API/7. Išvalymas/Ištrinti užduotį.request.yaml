$kind: http-request
description: |-
  Ištrina užduotį kartu su visais jos įrašais (`204 No Content`).

  docs/API.md lentelės metodas **#10**.
url: "{{baseUrl}}/guilds/{{guildA}}/quests/{{questId}}"
method: DELETE
scripts:
  - type: afterResponse
    code: pm.test('204 No Content', () => pm.response.to.have.status(204));
    language: text/javascript
examples: ./.resources/Ištrinti užduotį.resources/examples
order: 1000
