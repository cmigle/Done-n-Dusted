$kind: http-request
description: |-
  Atšaukia refresh žetoną. Access žetonas galioja iki savo `exp` (serveris jų nesaugo), todėl jis trumpas — 15 min.

  docs/API.md lentelės metodas **#19**.
url: "{{baseUrl}}/auth/logout"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "refreshToken": "{{refreshToken}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('204 No Content', () => pm.response.to.have.status(204));
      pm.test('Atsakymas be turinio', () => pm.expect(pm.response.text()).to.be.empty);
    language: text/javascript
examples: ./.resources/Atsijungti.resources/examples
order: 13000
