$kind: http-request
description: |-
  Pirma užklausa su žetonu (kolekcijos *Bearer Token* `{{accessToken}}`). Grąžina prisijungusį naudotoją ir jo grupes su rolėmis — naujas naudotojas dar niekur nepriklauso.

  docs/API.md lentelės metodas **#20**.
url: "{{baseUrl}}/auth/me"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Atpazintas tas pats naudotojas', () => pm.expect(body.id).to.eql(Number(pm.collectionVariables.get('userId'))));
      pm.test('Naujas naudotojas dar nepriklauso jokiai grupei', () => pm.expect(body.memberships).to.eql([]));
    language: text/javascript
examples: ./.resources/Kas aš.resources/examples
order: 6000
