$kind: http-request
description: Be `Authorization` antraštės pasiekiama tik registracija, prisijungimas ir žetonų atnaujinimas. Kitur — `401` ta pačia `ApiError` struktūra.
url: "{{baseUrl}}/guilds"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('401 Unauthorized', () => pm.response.to.have.status(401));
      pm.test('WWW-Authenticate: Bearer', () => pm.expect(pm.response.headers.get('WWW-Authenticate')).to.eql('Bearer'));
      pm.test('ApiError paaiskina, ko truksta', () => {
        const e = pm.response.json();
        pm.expect(e.status).to.eql(401);
        pm.expect(e.message).to.include('Bearer');
      });
    language: text/javascript
examples: ./.resources/Klaida 401 – be žetono.resources/examples
order: 7000
