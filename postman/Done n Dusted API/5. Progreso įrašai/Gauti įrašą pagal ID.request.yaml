$kind: http-request
description: |-
  Grąžina vieną progreso įrašą per užduotį ir grupę.

  docs/API.md lentelės metodas **#12**.
url: "{{baseUrl}}/guilds/{{guildA}}/quests/{{questId}}/logs/{{logId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('Tas pats irasas', () => pm.expect(pm.response.json().id).to.eql(Number(pm.collectionVariables.get('logId'))));
    language: text/javascript
examples: ./.resources/Gauti įrašą pagal ID.resources/examples
order: 4000
