$kind: http-request
description: |-
  Savininkas prideda naudotoją `jonas` kaip žaidėją. Naudotojas nurodomas vardu.

  docs/API.md lentelės metodas **#23**.
url: "{{baseUrl}}/guilds/{{guildA}}/members"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "jonas",
      "role": "PLAYER"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('201 Created', () => pm.response.to.have.status(201));
      const body = pm.response.json();
      pm.test('Location nurodo nauja nari', () => pm.expect(pm.response.headers.get('Location')).to.include('/members/' + pm.collectionVariables.get('playerId')));
      pm.test('jonas - grupes PLAYER', () => {
        pm.expect(body.userId).to.eql(Number(pm.collectionVariables.get('playerId')));
        pm.expect(body.username).to.eql('jonas');
        pm.expect(body.role).to.eql('PLAYER');
      });
    language: text/javascript
examples: ./.resources/Pridėti narį – žaidėjas.resources/examples
order: 2000
