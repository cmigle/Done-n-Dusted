$kind: http-request
description: |-
  Grąžina vieną užduotį per jos tėvinę grupę.

  docs/API.md lentelės metodas **#7**.
url: "{{baseUrl}}/guilds/{{guildA}}/quests/{{questId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('Ta pati uzduotis', () => pm.expect(pm.response.json().id).to.eql(Number(pm.collectionVariables.get('questId'))));
    language: text/javascript
examples: ./.resources/Gauti užduotį pagal ID.resources/examples
order: 4000
