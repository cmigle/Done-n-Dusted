$kind: http-request
url: "{{baseUrl}}/guilds/{{guildA}}/quests/{{questId}}/logs"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "note": "Nubegau 10 km per 52 minutes",
      "evidenceUrl": "https://example.org/evidence/run.png",
      "occurredAt": "{{occurredAt}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('201 Created', () => pm.response.to.have.status(201));
      const body = pm.response.json();
      pm.test('Naujas irasas visada PENDING ir be tasku', () => {
        pm.expect(body.status).to.eql('PENDING');
        pm.expect(body.xpAwarded).to.eql(0);
        pm.expect(body.inspirationAwarded).to.eql(0);
        pm.expect(body.reviewedAt).to.be.undefined;
      });
      pm.collectionVariables.set('logId', body.id);
    language: text/javascript
order: 1000
description: |-
  Užregistruoja progresą užduočiai ir išsaugo įrašo ID kintamajame `logId`.

  Naujas įrašas visada yra `PENDING` būsenos, su `xpAwarded = 0` ir `inspirationAwarded = 0`. Laukas `occurredAt` negali būti ateityje.

  README lentelės metodas **#13**.
examples: './.resources/Užregistruoti progresą.resources/examples'
