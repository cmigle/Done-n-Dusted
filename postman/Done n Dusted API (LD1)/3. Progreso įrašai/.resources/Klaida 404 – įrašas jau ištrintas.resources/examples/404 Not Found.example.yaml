$kind: http-example
name: "404 Not Found"
request:
  url: "{{baseUrl}}/guilds/{{guildA}}/quests/{{questId}}/logs/{{logId}}"
  method: DELETE
response:
  statusCode: 404
  statusText: "Not Found"
  headers:
    - key: Content-Type
      value: "application/json"
  body:
    type: json
    content: |-
      {
        "timestamp": "2026-10-18T17:36:45.207098200Z",
        "status": 404,
        "error": "Not Found",
        "message": "LogEntry 13 nerastas uzduotyje 10",
        "path": "/api/guilds/4/quests/10/logs/13"
      }
order: 1000
