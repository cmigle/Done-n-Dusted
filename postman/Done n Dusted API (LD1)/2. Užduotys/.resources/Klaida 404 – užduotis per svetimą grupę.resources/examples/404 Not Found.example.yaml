$kind: http-example
name: "404 Not Found"
request:
  url: "{{baseUrl}}/guilds/{{guildB}}/quests/{{questId}}"
  method: GET
response:
  statusCode: 404
  statusText: "Not Found"
  headers:
    - key: Content-Type
      value: "application/json"
  body:
    type: json
    content: |-
      {
        "timestamp": "2026-10-18T17:36:44.612602800Z",
        "status": 404,
        "error": "Not Found",
        "message": "Quest 10 nerasta grupeje 5",
        "path": "/api/guilds/5/quests/10"
      }
order: 1000
