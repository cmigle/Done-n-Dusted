$kind: http-request
url: "{{baseUrl}}/guilds/{{guildA}}/quests?stat=CON"
method: GET
queryParams:
  stat: CON
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Filtras pagal stat suveike', () => {
        pm.expect(body.page.totalElements).to.eql(1);
        pm.expect(body.content[0].stat).to.eql('CON');
      });
      pm.test('Filtras islieka nuorodose', () => pm.expect(body.links.self).to.include('stat=CON'));
    language: text/javascript
order: 3000
description: |-
  Grąžina puslapiuotą grupės užduočių sąrašą.

  Galimi filtrai: `stat`, `type`, `difficulty`, `active`. Čia filtruojama pagal `stat=CON`, o filtras išlieka ir `links` nuorodose.

  README lentelės metodas **#6**.
examples: './.resources/Gauti užduočių sąrašą pagal charakteristiką.resources/examples'
