$kind: http-request
url: "{{baseUrl}}/guilds"
method: GET
queryParams: []
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const guilds = pm.response.json().content;
      const ids = guilds.map(g => g.id);
      pm.test('Grazintos visos grupes, ID: ' + [...ids].sort((a, b) => a - b).join(', '), () => {
        pm.expect(ids).to.include(Number(pm.collectionVariables.get('guildA')));
        pm.expect(ids).to.include(Number(pm.collectionVariables.get('guildB')));
      });
      pm.test('Kiekviena grupe turi id, pavadinima ir aprasyma', () => {
        guilds.forEach(g => {
          pm.expect(g.id).to.be.a('number');
          pm.expect(g.name).to.be.a('string');
          pm.expect(g.description).to.be.a('string');
        });
      });
    language: text/javascript
order: 3000
description: |-
  Grąžina visų grupių sąrašą su numatytaisiais parametrais (iki 20 grupių puslapyje, rikiuojama pagal pavadinimą).

  * `name` filtruoja pagal pavadinimo dalį.
  * `page`, `size` ir `sort` (pvz. `sort=name,asc`) valdo puslapiavimą. Didžiausias `size` yra 100.

  Puslapiavimas atskirai parodomas dviejose kitose užklausose.

  README lentelės metodas **#1**.
examples: './.resources/Gauti grupių sąrašą.resources/examples'
