$kind: http-request
url: "{{baseUrl}}/guilds"
method: POST
headers:
  Content-Type: text/plain
body:
  type: text
  content: sveiki
scripts:
  - type: afterResponse
    code: |-
      pm.test('415 Unsupported Media Type', () => pm.response.to.have.status(415));
      pm.test('ApiError paaiskina palaikoma tipa', () => pm.expect(pm.response.json().message).to.include('application/json'));
    language: text/javascript
order: 8000
description: |-
  Kūnas siunčiamas `text/plain` tipu. API priima tik `application/json`, todėl grąžinamas `415 Unsupported Media Type`.
examples: './.resources/Klaida 415 – ne JSON turinys.resources/examples'
