$kind: http-example
name: "404 Not Found"
request:
  url: "{{baseUrl}}/guilds/999999"
  method: GET
response:
  statusCode: 404
  statusText: "Not Found"
  headers:
    - key: Content-Type
      value: "application/json"
  body:
    type: json
    content: |-
      {
        "timestamp": "2026-10-18T17:36:44.255241100Z",
        "status": 404,
        "error": "Not Found",
        "message": "Guild 999999 nerasta",
        "path": "/api/guilds/999999"
      }
order: 1000
