$kind: http-example
name: "415 Unsupported Media Type"
request:
  url: "{{baseUrl}}/guilds"
  method: POST
response:
  statusCode: 415
  statusText: "Unsupported Media Type"
  headers:
    - key: Content-Type
      value: "application/json"
  body:
    type: json
    content: |-
      {
        "timestamp": "2026-10-18T17:36:44.186603900Z",
        "status": 415,
        "error": "Unsupported Media Type",
        "message": "Palaikomas tik application/json; gauta: text/plain",
        "path": "/api/guilds"
      }
order: 1000
