$kind: http-example
name: "409 Conflict"
request:
  url: "{{baseUrl}}/guilds"
  method: POST
response:
  statusCode: 409
  statusText: "Conflict"
  headers:
    - key: Content-Type
      value: "application/json"
  body:
    type: json
    content: |-
      {
        "timestamp": "2026-10-18T17:36:44.096908700Z",
        "status": 409,
        "error": "Conflict",
        "message": "Grupe pavadinimu 'Postman Guild 1792345003168' jau egzistuoja",
        "path": "/api/guilds"
      }
order: 1000
