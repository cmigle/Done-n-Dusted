$kind: http-request
url: "{{baseUrl}}/guilds/{{guildA}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "{{guildName}}",
      "description": "Aprasymas po redagavimo"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('Pakeitimas issaugotas', () => pm.expect(pm.response.json().description).to.eql('Aprasymas po redagavimo'));
    language: text/javascript
order: 5000
description: |-
  Atnaujina grupę (`PUT`, siunčiami visi redaguojami laukai). Čia pakeičiamas aprašymas.

  README lentelės metodas **#4**.
examples: './.resources/Atnaujinti grupę.resources/examples'
